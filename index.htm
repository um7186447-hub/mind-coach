    function renderReferenceExerciseForm(source, session, copy) {
      const form = document.createElement("form");
      form.className = "mt-4 space-y-4";
      form.dataset.referenceExercise = source.id;
      const instruction = document.createElement("p");
      instruction.className = "text-sm text-slate-300";
      instruction.textContent = copy.interval;
      form.appendChild(instruction);

      session.questionIds.forEach((id, index) => {
        const question = source.questions.find((item) => item.id === id);
        const fieldset = document.createElement("fieldset");
        fieldset.className = "rounded-md border border-white/10 p-4";
        const legend = document.createElement("legend");
        legend.className = "px-1 text-sm";
        legend.textContent = `${index + 1}. ${question[state.lang]}`;
        fieldset.appendChild(legend);
        const options = document.createElement("div");
        options.className = "mt-3 flex flex-wrap gap-2";
        copy.scale.forEach((label, score) => {
          const wrapper = document.createElement("label");
          wrapper.className = "cursor-pointer rounded-md border border-white/15 px-3 py-2 text-sm";
          const input = document.createElement("input");
          input.className = "mr-2 ltr-only";
          input.type = "radio";
          input.name = id;
          input.value = String(score);
          input.required = true;
          input.checked = session.answers?.[id] === String(score);
          wrapper.append(input, document.createTextNode(label));
          options.appendChild(wrapper);
        });
        fieldset.appendChild(options);
        form.appendChild(fieldset);
      });

      const submit = document.createElement("button");
      submit.type = "submit";
      submit.className = "rounded-md bg-cyan-400 px-4 py-2 font-semibold text-slate-950";
      submit.textContent = copy.submit;
      form.appendChild(submit);
      if (session.result) form.appendChild(renderReferenceExerciseResult(source, session));
      if (session.result) {
        const retry = document.createElement("button");
        retry.type = "button";
        retry.className = "ml-2 rounded-md border border-white/25 px-4 py-2 text-sm";
        retry.dataset.referenceStart = source.id;
        retry.textContent = copy.retry;
        form.appendChild(retry);
      }
      return form;
    }

    function renderReferenceLibrary() {
      const root = $("#reference-library");
      if (!root) return;
      root.querySelectorAll("form[data-reference-exercise]").forEach((form) => {
        const session = state.referenceSessions[form.dataset.referenceExercise];
        if (!session || session.result) return;
        const selected = Object.fromEntries(new FormData(form).entries());
        if (Object.keys(selected).length) session.answers = selected;
      });
      root.querySelectorAll("details[data-reference-details]").forEach((details) => {
        const session = state.referenceSessions[details.dataset.referenceDetails];
        if (session) session.open = details.open;
      });
      referenceExercises.forEach((source) => {
        if (!state.referenceSessions[source.id]) loadReferenceSession(source);
      });

      const copy = referenceExerciseCopy[state.lang];
      root.replaceChildren();
      referenceExercises.forEach((source) => {
        const card = document.createElement("article");
        card.className = "reference-card rounded-xl border border-white/10 bg-slate-900/60 p-5";
        const heading = document.createElement("h3");
        heading.className = "text-lg font-semibold";
        heading.textContent = source.citation;
        const link = document.createElement("a");
        link.className = "mt-2 inline-flex text-sm underline underline-offset-4";
        link.href = source.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = copy.readSource;
        const info = source.info[state.lang];
        const description = document.createElement("p");
        description.className = "mt-4 text-sm leading-relaxed";
        const use = document.createElement("p");
        use.className = "mt-3 text-sm leading-relaxed";
        const limit = document.createElement("p");
        limit.className = "mt-3 text-sm leading-relaxed text-slate-300";
        [[description, copy.what, info.definition], [use, copy.why, info.use], [limit, copy.limit, info.limit]].forEach(([paragraph, label, value]) => {
          const strong = document.createElement("strong");
          strong.textContent = `${label} `;
          paragraph.append(strong, document.createTextNode(value));
        });
        const duration = document.createElement("p");
        duration.className = "mt-3 text-sm font-medium text-amber-200";
        duration.textContent = info.duration;

        const details = document.createElement("details");
        details.className = "mt-4 rounded-lg border border-white/10 bg-slate-950/35 p-4";
        details.dataset.referenceDetails = source.id;
        const summary = document.createElement("summary");
        summary.className = "cursor-pointer font-medium";
        summary.textContent = copy.activity;
        details.appendChild(summary);
        const session = state.referenceSessions[source.id];
        if (session) {
          session.open = session.open ?? false;
          details.open = session.open;
          details.appendChild(renderReferenceExerciseForm(source, session, copy));
        } else {
          const start = document.createElement("button");
          start.type = "button";
          start.className = "mt-4 rounded-md border border-white/25 px-4 py-2 text-sm";
          start.dataset.referenceStart = source.id;
          start.textContent = copy.start;
          details.appendChild(start);
        }
        card.append(heading, link, description, use, limit, duration, details);
        root.appendChild(card);
      });
      const privacy = document.createElement("p");
      privacy.className = "md:col-span-2 text-xs leading-relaxed text-slate-400";
      privacy.textContent = copy.privacy;
      root.appendChild(privacy);
    }

    function startReferenceExercise(sourceId) {
      const source = referenceExercises.find((item) => item.id === sourceId);
      if (!source) return;
      try {
        const questionSet = chooseReferenceQuestions(source);
        saveReferenceSession(sourceId, {
          questionIds: questionSet.map((question) => question.id),
          answers: null,
          result: false,
          open: true
        });
        setReferenceLibraryStatus("", false);
        renderReferenceLibrary();
        $(`#reference-library details[data-reference-details="${sourceId}"]`)?.scrollIntoView({ behavior: "smooth", block: "nearest" });
      } catch (error) {
        setReferenceLibraryStatus(error.message || "Unable to create a new question set.");
      }
    }

    function resetBreathingVisual() {
      $("#breath-phase").textContent = t("breathing.ready");
      $("#breath-count").textContent = `${state.breathCycles} ${t("breathing.cycles")}`;
    }

    function breathingLoop() {
      const phases = t("breathing.phases");
      const pattern = [{ d: 4000, ex: true }, { d: 4000, ex: true }, { d: 6000, ex: false }];
      const phase = pattern[state.breathStep];
      $("#breath-phase").textContent = phases[state.breathStep];
      $("#breath-orb").classList.toggle("expand", phase.ex);

      state.breathTimer = setTimeout(() => {
        if (state.breathStep === 2) {
          state.breathCycles += 1;
          $("#breath-count").textContent = `${state.breathCycles} ${t("breathing.cycles")}`;
          localStorage.setItem("mc-breath-sessions", String(Number(localStorage.getItem("mc-breath-sessions") || "0") + 1));
        }
        state.breathStep = (state.breathStep + 1) % 3;
        breathingLoop();
      }, phase.d);
    }

    function renderSleepChecklist() {
      const list = $("#sleep-list");
      const items = sleepChecklist[state.lang];
      const saved = JSON.parse(localStorage.getItem("mc-sleep-guest") || "[]");
      list.innerHTML = "";
      items.forEach((item, i) => {
        list.innerHTML += `<li class="flex items-start gap-3 py-4"><input id="sl-${i}" type="checkbox" class="mt-1 h-4 w-4 shrink-0 accent-cyan-300" ${saved[i] ? "checked" : ""}><div class="min-w-0 flex-1"><label for="sl-${i}" class="cursor-pointer font-medium">${item.label}</label><p class="sleep-why mt-1 text-sm leading-relaxed">${item.why}</p><p class="sleep-benefit mt-1 text-xs leading-relaxed"><strong>${t("sleep.benefit")}:</strong> ${item.benefit}</p></div></li>`;
      });

      list.querySelectorAll("input").forEach((input) => {
        input.addEventListener("change", () => {
          const stateList = [...list.querySelectorAll("input")].map((i) => i.checked);

          updateSleepProgress();
        });
      });
      updateSleepProgress();

    function updateSleepProgress() {
      const checks = [...$("#sleep-list").querySelectorAll("input")];
      const done = checks.filter((x) => x.checked).length;
      $("#sleep-progress").textContent = `${done} / ${checks.length} ${t("sleep.done")}`;
    }

    function handleSchemaSubmit(e) {
      e.preventDefault();
      if (state.resultTimers.schema) return;
      const fd = new FormData(e.target);
      const rawByDim = {};
      state.activeSchemaQuestions.forEach((q) => {
        rawByDim[q.dim] = (rawByDim[q.dim] || 0) + Number(fd.get(q.id) || 0);
      });
      const analysis = schemaAnalysis(rawByDim);
      state.lastSchemaAnalysis = analysis;
      state.lastSchemaRaw = rawByDim;
      localStorage.setItem("mc-combined-schema", JSON.stringify({ scores: rawByDim, date: new Date().toISOString() }));
      renderSchemaResults(analysis);
      renderCombinedResults();
      void saveAccountResult("schema", { scores: analysis.normalizedByDim });
      scheduleResultReveal("schema");
    }

    function handleReflectionSubmit(e) {
      e.preventDefault();
      if (state.resultTimers.reflection) return;
      const formData = new FormData(e.target);
      const responses = state.activeReflectionQuestions.map((question) => ({
        dimension: question.dim,
        score: Number(formData.get(question.id))
      }));
      const scores = scoreReflection(responses);
      state.lastReflectionScores = scores;
      const date = new Date().toISOString();
      localStorage.setItem("mc-combined-reflection", JSON.stringify({ scores, date }));
      renderReflectionResults(scores);
      renderCombinedResults();
      void saveAccountResult("reflection", { scores });
      scheduleResultReveal("reflection");
    }

      menuButton.addEventListener("click", () => setMenuOpen(menuButton.getAttribute("aria-expanded") !== "true"));
      topNav.addEventListener("click", (event) => {

      const accountTabs = $("#account-tabs");

        other.setAttribute("aria-selected", "false");

        $("#login-form").hidden = isRegister;
        if (moveFocus) selected.focus();

        setAccountFormView(tab.dataset.accountTab);

        $("#account-status").classList.add("hidden");

          return;
        }
        const submit = form.querySelector('button[type="submit"]');
        submit.disabled = true;
        const email = form.elements.email.value;
        const password = form.elements.password.value;
        try {
          try {
            await accountRequest("/api/register", {
              method: "POST",
              body: JSON.stringify({
                email,
                password,
                dataConsent: true,
                weeklyReports: form.elements.weeklyReports.checked
              })
            });
          } catch (error) {
            if (error.status !== 409) throw error;
            await accountRequest("/api/login", {
              method: "POST",
              body: JSON.stringify({ email, password })
            });
          }
          try {
            await syncGuestResults();
          } catch (error) {
            setAccountStatus(`${t("account.saveFailed")} ${error.message}`, true);
          }
          form.reset();
          window.location.assign("?page=home");

          if (error.status === 401) {

            setAccountFormView("login", true);
            $("#login-form").elements.email.value = email;
            $("#login-form").elements.password.value = password;
            $("#login-form").elements.password.focus();

          submit.disabled = false;
        }

            method: "POST",
            body: JSON.stringify({ email: form.elements.email.value, password: form.elements.password.value })

      $("#clear-sleep").addEventListener("click", () => {

        renderSleepChecklist();
      });

    function loadPreferences() {
      const interfaceVersion = "evora-editorial-v1";
      if (localStorage.getItem("mc-interface-version") !== interfaceVersion) {
        localStorage.setItem("mc-theme", "light");
        localStorage.setItem("mc-interface-version", interfaceVersion);

      const theme = localStorage.getItem("mc-theme") || "light";

    function replayVisibleReveals() {
      $$(".fade-up, .scroll-reveal").forEach((el) => {
        if (!el.getClientRects().length) return;
        el.classList.add(el.classList.contains("scroll-reveal") ? "is-visible" : "show");
      });
    }

    function initReveal() {
      const selector = "main#top > section, main#top article, main#top form, main#top form fieldset, main#top section section, #primary-nav .side-icon, main#top .page-cover, #sleep-list > li, #reference-library > *, #reflection-results > *, #assessment-results > *, #schema-results > *, #combined-results article";
      const observer = "IntersectionObserver" in window ? new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          const target = entry.target;
          target.classList.add(target.classList.contains("scroll-reveal") ? "is-visible" : "show");
          observer.unobserve(target);
        });
      }, { threshold: 0.04, rootMargin: "0px 0px 100px 0px" }) : null;
      const addTarget = (el) => {
        if (!(el instanceof Element) || el.dataset.revealObserved === "true") return;
        el.dataset.revealObserved = "true";
        if (!el.classList.contains("fade-up")) el.classList.add("scroll-reveal");
        if (observer) observer.observe(el);
        else el.classList.add("is-visible", "show");
      };
      const observeNewTargets = (root) => {
        if (!(root instanceof Element)) return;
        if (root.matches(selector) || root.matches(".fade-up")) addTarget(root);
        root.querySelectorAll(`${selector}, .fade-up`).forEach(addTarget);
      };
      observeNewTargets(document.querySelector("main#top"));
      let queuedRoots = new Set();
      let scanFrame = 0;
      const mutations = new MutationObserver((records) => {
        records.forEach((record) => record.addedNodes.forEach((node) => {
          if (node instanceof Element) queuedRoots.add(node);
        }));
        if (queuedRoots.size && !scanFrame) scanFrame = requestAnimationFrame(() => {
          scanFrame = 0;
          queuedRoots.forEach(observeNewTargets);
          queuedRoots.clear();
        });
      });
      mutations.observe($("main#top"), { childList: true, subtree: true });
    }

    let scrollFrame = 0;
    let scrollableHeight = 0;
    let previousScrollProgress = -1;
    let previousScrolledState = false;
    function measureScrollRange() {
      scrollableHeight = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    }
    function updateScrollProgress() {
      if (scrollFrame) return;
      scrollFrame = requestAnimationFrame(() => {
        scrollFrame = 0;
        const scrolled = window.scrollY > 24;
        if (scrolled !== previousScrolledState) {
          document.body.classList.toggle("has-scrolled", scrolled);
          previousScrolledState = scrolled;
        }
        const progress = scrollableHeight > 0 ? Math.min(1, Math.max(0, window.scrollY / scrollableHeight)) : 0;
        const roundedProgress = Math.round(progress * 1000) / 1000;
        if (roundedProgress !== previousScrollProgress) {
          document.documentElement.style.setProperty("--scroll-progress", roundedProgress.toFixed(3));
          previousScrollProgress = roundedProgress;
        }
      });
    }
    window.addEventListener("scroll", updateScrollProgress, { passive: true });
    window.addEventListener("resize", () => { measureScrollRange(); updateScrollProgress(); }, { passive: true });
    if ("ResizeObserver" in window) {
      const pageResizeObserver = new ResizeObserver(() => { measureScrollRange(); updateScrollProgress(); });
      pageResizeObserver.observe($("main#top"));
    }
    measureScrollRange();
    window.addEventListener("pageshow", () => {
      document.body.classList.remove("presentation-leaving");
    });
    window.addEventListener("popstate", () => renderRouteFromLocation());

    applyPageLayout();
    initEvents();
    loadPreferences();
    applyTranslations();
    restoreLatestAssessmentResult();
    renderHomeProgress();
    initReveal();
    updateScrollProgress();
    renderHistory();
    void initializeAccount();
    window.setInterval(renderDaypartNote, 60_000);
  </script>
</body>
