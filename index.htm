    const questionBank = [{"id":"s1","dim":"stress","text":{"fr":"J’ai l’impression d’avoir l’esprit surchargé.","en":"I feel mentally overloaded.","ar":"أشعر بأن ذهني مثقل.","darija":"كنحس بحالي راسي عامر ومجهد."}},{"id":"s2","dim":"stress","text":{"fr":"J’ai du mal à me détendre.","en":"I find it hard to relax.","ar":"أجد صعوبة في الاسترخاء.","darija":"كتصعاب عليا نرتاح."}},{"id":"s3","dim":"stress","text":{"fr":"Je reste tendu·e, notamment dans les épaules ou la mâchoire.","en":"My shoulders, jaw, or other muscles often feel tense.","ar":"أشعر بتوتر مستمر في جسدي، خاصة في الكتفين أو الفك.","darija":"كيبقى جسمي مشدود، خصوصا فالكتاف ولا الفك."}},{"id":"s4","dim":"stress","text":{"fr":"La pression me rend plus irritable.","en":"I feel more irritable when under pressure.","ar":"يجعلني الضغط سريع الانفعال.","darija":"الضغط كيخليني نتعصب بسهولة."}},{"id":"s5","dim":"stress","text":{"fr":"J’ai l’impression de devoir courir toute la journée.","en":"I feel as though I have to rush all day.","ar":"أشعر كأنني أركض طوال اليوم.","darija":"كنحس بحالي خاصني نبقى نجري النهار كامل."}},{"id":"s6","dim":"stress","text":{"fr":"Quand je suis stressé·e, j’ai parfois mal à la tête ou des tensions musculaires.","en":"When I feel stressed, I sometimes get headaches or muscle tension.","ar":"أصاب أحيانا بصداع أو شد عضلي عندما أكون تحت الضغط.","darija":"ملي كنكون مضغوط، كيجيّني مرات الصداع ولا كيتشد ليا جسمي."}},{"id":"a1","dim":"anxiety","text":{"fr":"Je m’inquiète souvent, même pour des choses que j’aimerais relativiser.","en":"I worry a lot, even when I would rather not.","ar":"أقلق كثيرا، حتى عندما لا أريد ذلك.","darija":"كنقلق بزاف حتى على حوايج ما بغيتش نقلق عليهم."}},{"id":"a2","dim":"anxiety","text":{"fr":"J’ai du mal à mettre mes inquiétudes de côté.","en":"I have trouble setting my worries aside.","ar":"يصعب علي أن أضع أفكاري المقلقة جانبا.","darija":"كتصعاب عليا نحيد الهموم من راسي."}},{"id":"a3","dim":"anxiety","text":{"fr":"Je me sens agité·e ou j’éprouve parfois une peur soud     const schemaBank = [{"id":"sc1","dim":"abandon","text":{"fr":"J’ai peur que des personnes importantes pour moi s’en aillent.","en":"I fear important people may leave me.","ar":"اخاف ان يتركني الاشخاص المهمون.","darija":"كنخاف الناس المهمين عندي يخلّيوّني."}},{"id":"sc2","dim":"abandon","text":{"fr":"Je me sens très anxieux·se quand une personne prend ses distances.","en":"I become very anxious when someone takes distance.","ar":"اشعر بقلق شديد عندما يبتعد شخص ما.","darija":"كنقلق بزاف ملي شي واحد كيبعد عليا."}},{"id":"sc3","dim":"rejection","text":{"fr":"Je me sens souvent rejeté·e sans élément clair qui le confirme.","en":"I often feel rejected without clear proof.","ar":"اشعر غالبا بالرفض دون دليل واضح.","darija":"كنحس بالرفض حتى بلا دليل واضح."}},{"id":"sc4","dim":"rejection","text":{"fr":"Je suppose rapidement que les autres me jugent négativement.","en":"I quickly assume others judge me negatively.","ar":"افترض بسرعة ان الاخرين يحكمون علي بسلبية.","darija":"كنفترض بسرعة الناس كيشوفوني بنظرة سلبية."}},{"id":"sc5","dim":"inferiority","text":{"fr":"Je me sens inférieur·e aux autres dans ma valeur personnelle.","en":"I feel inferior to others in personal worth.","ar":"اشعر ان قيمتي اقل من الاخرين.","darija":"كنحس راسي اقل قيمة من الناس."}},{"id":"sc6","dim":"inferiority","text":{"fr":"Je me critique durement pour de petites erreurs.","en":"I harshly criticize myself for small mistakes.","ar":"انتقد نفسي بقسوة بسبب اخطاء صغيرة.","darija":"كنقسي على راسي بزاف على اخطاء صغيرة."}},{"id":"sc7","dim":"perfectionism","text":{"fr":"Je crois devoir être parfait·e pour être accepté·e.","en":"I feel I must be perfect to be accepted.","ar":"اشعر ان علي ان اكون مثاليا حتى اقبل.","darija":"كنحس خاصني نكون كامل باش يتقبلوني."}},{"id":"sc8","dim":"perfectionism","text":{"fr":"Je remets des tâches à plus tard si je ne peux pas les faire parfaitement.","en":"I procrastinate when I cannot do things perfectly.","ar":"اؤجل المهام عندما لا استطيع تنفيذها بشكل مثالي.","darija":"كنأجل u sens pour moi.","en":"I set a small goal that feels meaningful to me.","ar":"أضع هدفا صغيرا له معنى بالنسبة لي.","darija":"كنحط هدف صغير عندو معنى بالنسبة ليا."}},{"id":"rf24","dim":"values_direction","text":{"fr":"Je peux ajuster mes priorités quand ma situation change.","en":"I can adjust my priorities when my situation changes.","ar":"أستطيع تعديل أولوياتي عندما تتغير ظروفي.","darija":"كنقدر نبدل الأولويات ديالي ملي كتبدل الظروف."}}];

    }

    function readFullAssessmentSession() {
      try {
        const saved = JSON.parse(localStorage.getItem(fullAssessmentSessionKey) || "null");
        return saved && typeof saved === "object" && Array.isArray(saved.completed) ? saved : null;
      } catch {
        return null;
      }
    }

    function startFullAssessment() {
      localStorage.setItem(fullAssessmentSessionKey, JSON.stringify({ startedAt: new Date().toISOString(), completed: [] }));
      ["assessment", "schema-form", "reflection-form"].forEach((formId) => localStorage.removeItem(`${fullAssessmentDraftPrefix}${formId}`));
      localStorage.removeItem("mc-active-question-set");
      ["assessment-form", "schema-form", "reflection-form"].forEach((formId) => document.getElementById(formId)?.reset());
      state.assessmentAnswers = {};
      state.activeQuestions = [];
      state.activeSchemaQuestions = [];
      state.activeReflectionQuestions = [];
    }

    function readFullAssessmentDraft(formId) {
      if (!isFullAssessmentFlow()) return {};
      try {
        const saved = JSON.parse(localStorage.getItem(`${fullAssessmentDraftPrefix}${formId}`) || "{}");
        if (!saved || typeof saved !== "object" || Array.isArray(saved)) return {};
        return Object.fromEntries(Object.entries(saved).filter(([name, value]) => typeof name === "string" && ["0", "1", "2", "3"].includes(String(value))));
      } catch {
        return {};
      }
    }

    function storeFullAssessmentDraft(formId) {
      if (!isFullAssessmentFlow()) return;
      const form = document.getElementById(formId);
      if (!form) return;
      const answers = Object.fromEntries([...form.querySelectorAll('input[type="radio"]:checked')].map((input) => [input.name, input.value]));
      localStorage.setItem(`${fullAssessmentDraftPrefix}${formId}`, JSON.stringify(answers));
    }

    function finishFullAssessmentStep(type) {
      const session = readFullAssessmentSession() || { startedAt: new Date().toISOString(), completed: [] };
      session.completed = [...new Set([...session.completed, type])];
      const nextPage = { assessment: "schemas", schema: "reflection", reflection: "results" }[type];
      if (type === "reflection") session.finishedAt = new Date().toISOString();
      localStorage.setItem(fullAssessmentSessionKey, JSON.stringify(session));
      const formId = { assessment: "assessment", schema: "schema-form", reflection: "reflection-form" }[type];
      if (formId) localStorage.removeItem(`${fullAssessmentDraftPrefix}${formId}`);
      navigateToAppUrl(new URL(`?page=${nextPage}&flow=full`, window.location.href));
    }

      en: { card: "Mental health", cardTitle: "Prepare to speak with a professional", cardDescription: "Describe what you’re experiencing and for how long to prepare for a consultation.", action: "Get ready", heroAction: "Prepare a visit summary", eyebrow: "Prepare for a conversation", title: "Talk about what you’re going through", intro: "A few prompts can help you explain your experience to a mental health professional.", concernsLabel: "What has been concerning you? (Select all that apply)", concerns: [["mood", "Low mood or sadness"], ["worry", "Worry or tension"], ["sleep", "Sleep"], ["energy", "Energy or concentration"], ["relationships", "Relationships or life difficulties"], ["other", "Something else"]], durationLabel: "How long has this been going on?", durations: [["days", "A few days"], ["weeks", "About two weeks"], ["month", "About a month"], ["longer", "More than a month"], ["unsure", "I’m not sure"]], impactLabel: "How much is this affecting your daily life?", impacts: [["little", "A little"], ["some", "Somewhat"], ["much", "A lot"]], notesLabel: "Is there anything else you would like to explain?", notesPlaceholder: "Write freely. Avoid adding your name or identifying details.", safetyLabel: "Are you at immediate risk of hurting yourself or someone else?", yes: "Yes", no: "No", submit: "Prepare my summary", resultTitle: "Summary to share with a professional", concernsHeading: "What’s concerning me", duration: "How long", impact: "Daily impact", details: "Details I want to share", safety: "Immediate safety", notSpecified: "Not specified", urgent: "If you are in immediate danger or afraid you may hurt yourself, go to someone you trust and contact local emergency services or a crisis service now.", nextStep: "If this continues or disrupts your daily activities, consider arranging an appointment with a health professional. This summary may help you explain what you’re experiencing.", copy: "Copy summary", print: "Print", copied: "Summary copied.", copyFaile       ar: { card: "الصحة النفسية", cardTitle: "حضّر للحديث مع مختص", cardDescription: "صف ما تشعر به ومنذ متى، لتستعد لموعد مع مختص.", action: "ابدأ", heroAction: "حضّر ملخصا للمختص", eyebrow: "الاستعداد للحديث مع مختص", title: "تحدث عما تمر به", intro: "قد تساعدك هذه الأسئلة على شرح تجربتك لمختص في الصحة النفسية.", concernsLabel: "ما الذي يقلقك؟ (يمكنك اختيار أكثر من خيار)", concerns: [["mood", "انخفاض المزاج أو الحزن"], ["worry", "القلق أو التوتر"], ["sleep", "النوم"], ["energy", "الطاقة أو التركيز"], ["relationships", "العلاقات أو صعوبات الحياة"], ["other", "شيء آخر"]], durationLabel: "منذ متى تشعر بهذا؟", durations: [["days", "منذ بضعة أيام"], ["weeks", "منذ نحو أسبوعين"], ["month", "منذ نحو شهر"], ["longer", "منذ أكثر من شهر"], ["unsure", "لست متأكدا"]], impactLabel: "ما مدى تأثير ذلك في حياتك اليومية؟", impacts: [["little", "قليل"], ["some", "إلى حد ما"], ["much", "كثيرا"]], notesLabel: "هل هناك شيء آخر ترغب في شرحه؟", notesPlaceholder: "اكتب ما تريد. تجنب إضافة اسمك أو معلومات تكشف هويتك.", safetyLabel: "هل يوجد خطر مباشر بأن تؤذي نفسك أو شخصا آخر؟", yes: "نعم", no: "لا", submit: "إعداد ملخصي", resultTitle: "ملخص يمكنك مشاركته مع مختص", concernsHeading: "ما يقلقني", duration: "المدة", impact: "الأثر اليومي", details: "تفاصيل أود مشاركتها", safety: "السلامة الفورية", notSpecified: "لم يحدد", urgent: "إذا كنت في خطر مباشر أو تخشى أن تؤذي نفسك، فابق مع شخص تثق به واتصل الآن بالطوارئ أو بخدمة الأزمات في منطقتك.", nextStep: "إذا استمر ما تمر به أو أثر في أنشطتك اليومية، ففكر في حجز موعد مع مختص صحي. قد يساعدك هذا الملخص على شرح تجربتك.", copy: "نسخ الملخص", print: "طباعة", copied: "تم نسخ الملخص.", copyFailed: "تعذر النسخ تلقائيا. يمكنك تحديد نص الملخص ونسخه.", privacy: "تنظم هذه الأداة ما تصفه، لكنها لا تقدم تشخيصا. تبقى إجاباتك في هذه الصفحة ولا تُحفظ أو تُرسل إلى الخادم." },
      darija: { card: "الصحة النفسية", cardTitle: "وجد راسك تهضر مع مختص", cardDescription: "شرح شنو كتحس ومدة هاد الإحساس باش توجد لموعد مع مختص.", action: "بدا", heroAction: "وجد ملخص للمختص", eyebrow: "وجد راسك للحديث مع مختص", title: "هضر على اللي كتدوز منو", intro: "هاد الأسئلة تقدر تعاونك تشرح التجربة ديالك لمختص فالصحة النفسية.", concernsLabel: "شنو اللي مقلقك؟ (تقدر تختار كثر من جواب)", concerns: [["mood", "هبوط فالمزاج ولا الحزن"], ["worry", "القلق ولا التوتر"], ["sleep", "النوم"], ["energy", "الطاقة ولا التركيز"], ["relationships", "العلاقات ولا صعوبات الحياة"], ["other", "شي حاجة أخرى"]], durationLabel: "شحال هادي وبدا هاد الإحساس؟", durations: [["days", "شي أيام"], ["weeks", "تقريبا جوج سيمانات"], ["month", "تقريبا شهر"], ["longer", "كثر من شهر"], ["unsure", "ما متأكدش"]], impactLabel: "شحال مأثر عليك فالحياة اليومية؟", impacts: [["little", "شوية"], ["some", "متوسط"], ["much", "بزاف"]], notesLabel: "واش كاين شي حاجة أخرى بغيتي تشرحها؟", notesPlaceholder: "كتب براحتك، وبلا ما تزيد سميتك ولا معلومات كتعرف بيك.", safetyLabel: "واش كاين خطر دابا أنك تضر راسك ولا شي واحد آخر؟", yes: "إيه", no: "لا", submit: "وجد الملخص ديالي", resultTitle: "ملخص تقدر تشاركو مع مختص", concernsHeading: "شنو مقلقني", duration: "المدة", impact: "التأثير على نهاري", details: "تفاصيل بغيت نشارك", safety: "السلامة دابا", notSpecified: "ما تحددش", urgent: "إلا كنت فخطر دابا ولا خايف تضر راسك، سير عند شي واحد كتتيق فيه وتاصل بالطوارئ ولا بخدمة الأزمات فالمنطقة ديالك دابا.", nextStep: "إلا بقى هاد الإحساس ولا بدا كيأثر على نهارك، حاول تاخذ موعد مع مختص صحي. هاد الملخص يقدر يعاونك تشرح ليه شنو واقع.", copy: "نسخ الملخص", print: "طبع", copied: "تنسخ الملخص.", copyFailed: "ما خدمش النسخ التلقائي. تقدر تحدد نص الملخص وتنسخو.", privacy: "هاد الأداة كتنظم المعلومات اللي كتكتب، ولكن ما كتعطيش تشخيص. الأجوبة كتبقى غير فهاد الصفحة، ما كتتحفظش وما كتتصيفطش للسيرفر." }

    const referenceExercises = [{"id":"phq9","citation":"Kroenke K, Spitzer RL, Williams JBW. The PHQ-9 (2001).","url":"https://pubmed.ncbi.nlm.nih.gov/11556941/","info":{"fr":{"definition":"Cette publication étudie le PHQ-9, un questionnaire standardisé de neuf items utilisé par des professionnels pour repérer et suivre des symptômes dépressifs.","use":"Elle est citée comme repère sur la manière dont des questions structurées peuvent soutenir une conversation sur l’humeur. L’exercice ci-dessous est écrit séparément et ne reprend pas le PHQ-9.","limit":"Notre mini-exercice n’est ni le PHQ-9 ni un dépistage validé. Il ne calcule aucun score clinique et ne permet pas de conclure à une dépression.","duration":"Temps : 3 questions, environ 2 minutes; les petites actions peuvent être essayées sur une semaine, selon tes capacités.","plan":["Choisis une activité quotidienne très petite et fais-la à un moment réaliste.","Note ce qui t’apporte un peu d’énergie ou de réconfort, sans exiger un changement immédiat d’humeur.","Si ce vécu dure, s’aggrave ou gêne tes activités, échange avec un professionnel de santé."]},"en":{"definition":"This paper studies the PHQ-9, a standardized nine-item questionnaire used by professionals to identify and monitor depressive symptoms.","use":"It is cited as background on how structured questions can support a conversation about mood. The exercise below is independently written and does not reproduce the PHQ-9.","limit":"This mini-exercise is not the PHQ-9 or a validated screen. It produces no clinical score and cannot establish dépression.","duration":"Time: 3 questions, about 2 minutes; small actions can be tried over a week, at your own pace.","plan":["Choose one very small daily activity and do it at a realistic time.","Notice what brings a little energy or comfort without requiring an immediate mood change.","If this experience persists, worsens, or disrupts daily life, speak with a health professional."]},"ar":{"definition":"تتناول هذه الدراسة PHQ-9، وهو استبيان معياري من تسعة بنود يستخدمه المختصون للتعرف على أعراض الاكتئاب ومتابعتها.","use":"نستشهد به كمرجع حول كيفية مساعدة الأسئلة المنظمة في الحديث عن المزاج. التمرين أدناه مكتوب بشكل مستقل ولا يعيد إنتاج PHQ-9.","limit":"هذا التمرين ليس PHQ-9 ولا أداة فحص معتمدة. لا ينتج درجة سريرية ولا يثبت وجود اكتئاب.","duration":"الوقت: ثلاثة أسئلة في نحو دقيقتين؛ يمكن تجربة الخطوات الصغيرة خلال أسبوع وبحسب قدرتك.","plan":["اختر نشاطا يوميا صغيرا جدا ونفذه في وقت مناسب.","لاحظ ما يمنحك قدرا بسيطا من الطاقة أو الراحة دون اشتراط تغير المزاج فورا.","إذا استمر هذا الشعور أو ازداد أو عطل حياتك، تحدث مع مختص صحي."]},"darija":{"definition":"هاد الدراسة كتدرس PHQ-9، استبيان معياري فيه تسعة أسئلة كيستعملوه المختصين باش يتعرفو على أعراض الاكتئاب ويتابعوها.","use":"كنذكروه كمرجع على كيفاش الأسئلة المنظمة تقدر تعاون فالنقاش على المزاج. التمرين اللي لتحت مكتوب بشكل مستقل وما كيعوّضش PHQ-9.","limit":"هاد التمرين ماشي PHQ-9 وماشي فحص معتمد. ما كيعطيش نقطة سريرية وما كيأكدش الاكتئاب.","duration":"الوقت: 3 ديال الأسئلة فحوالي جوج دقايق؛ تقدر تجرب الخطوات الصغيرة فسيمانة وعلى حساب القدرة ديالك.","plan":["اختار نشاط يومي صغير بزاف وديرو فوقت مناسب ليك.","لاحظ شنو كيعطيك شوية ديال الطاقة ولا الراحة بلا ما تفرض على راسك تبدل المزاج دغيا.","إلا بقى هاد الإحساس ولا تزاد ولا أثر على حياتك، هضر مع مختص صحي."]}},"questions":[{"id":"phq9-a","group":"routine","fr":"J’ai du mal à garder une petite routine qui me fait du bien.","en":"I find it hard to keep a small routine that supports me.","ar":"أجد صعوبة في الحفاظ على عادة صغيرة تدعمني.","darija":"كيصعب عليا نحافظ على عادة صغيرة كتنفعني."},{"id":"phq9-b","group":"routine","fr":"Les tâches ordinaires me semblent parfois plus lourdes qu’avant.","en":"Everyday tasks sometimes feel heavier than they used to.","ar":"تبدو لي المهام اليومية أحيانا أثقل من السابق.","darija":"المهام اليومية كيبانو ليا مرات تقال كثر من قبل."},{"id":"phq9-c","group":"mood","fr":"Je remarque difficilement ce qui m’apporte un peu de réconfort.","en":"I find it difficult to notice what brings me some comfort.","ar":"يصعب علي ملاحظة ما يمنحني بعض الراحة.","darija":"كيصعب عليا نلاحظ شنو كيجيب ليا شوية ديال الراحة."},{"id":"phq9-d","group":"mood","fr":"Quand une journée est difficile, j’ai du mal à reconnaître mes efforts.","en":"On a difficult day, I struggle to acknowledge my efforts.","ar":"في يوم صعب، يصعب علي تقدير الجهد الذي بذلته.","darija":"فالنهار الصعيب كيصعب عليا نعترف بالمجهود اللي درت."},{"id":"phq9-e","group":"support","fr":"Je ne sais pas toujours vers qui me tourner quand j’ai besoin de soutien.","en":"I am not always sure whom to turn to when I need support.","ar":"لا أعرف دائما إلى من ألجأ عندما أحتاج إلى دعم.","darija":"ما كنعرفش ديما شكون نقدر نطلب منو الدعم."},{"id":"phq9-f","group":"support","fr":"Je repousse le moment de parler à quelqu’un de confiance de mon vécu.","en":"I put off talking with someone I trust about what I am going through.","ar":"أؤجل الحديث مع شخص أثق به عما أمر به.","darija":"كنأجل نهضر مع شي واحد كنتيق فيه على اللي كندوز منو."}]},{"id":"gad7","citation":"Spitzer RL, Kroenke K, Williams JBW, Löwe B. The GAD-7 (2006).","url":"https://pubmed.ncbi.nlm.nih.gov/16717171/","info":{"fr":{"definition":"Cette étude présente le GAD-7, un questionnaire standardisé de sept items étudié pour repérer et suivre des symptômes d’anxiété généralisée.","use":"La référence rappelle l’intérêt de parler des inquiétudes et de leur impact avec un professionnel. Notre exercice est distinct et ne reproduit aucun item du GAD-7.","limit":"Cet exercice maison n’est pas le GAD-7, un outil validé, ni un diagnostic. Il sert seulement à faire le point sur des situations du quotidien.","duration":"Temps : environ 2 minutes pour les questions; teste les petites stratégies pendant une semaine si elles te conviennent.","plan":["Quand une inquiétude apparaît, écris le fait connu et ce qui reste incertain.","Choisis une petite action utile dans le présent au lieu de chercher une certitude parfaite.","Si l’inquiétude limite souvent ta vie, demande conseil à un professionnel."]},"en":{"definition":"This study introduces the GAD-7, a standardized seven-item questionnaire studied for identifying and monitoring generalized anxiety symptoms.","use":"The reference highlights the value of discussing worries and their impact with a professional. Our exercise is separate and reproduces no GAD-7 items.","limit":"This custom exercise is not the GAD-7, a validated tool, or a diagnosis. It is only a prompt to reflect on everyday experiences.","duration":"Time: about 2 minutes for the questions; try small strategies for a week if they suit you.","plan":["When a worry appears, write down what is known and what remains uncertain.","Choose one small useful action in the present rather than seeking perfect certainty.","If worry often limits your life, ask a professional for advice."]},"ar":{"definition":"تقدم هذه الدراسة GAD-7، وهو استبيان معياري من سبعة بنود دُرس للتعرف على أعراض القلق العام ومتابعتها.","use":"يشير المرجع إلى أهمية مناقشة المخاوف وتأثيرها مع مختص. تمريننا مستقل ولا يعيد إنتاج أي بند من GAD-7.","limit":"هذا التمرين المخصص ليس GAD-7 ولا أداة معتمدة ولا تشخيصا. هو مجرد وسيلة للتأمل في مواقف الحياة اليومية.","duration":"الوقت: نحو دقيقتين للأسئلة؛ جرب خطوات صغيرة لمدة أسبوع إذا كانت مناسبة لك.","plan":["عندما يظهر القلق، اكتب ما تعرفه وما لا يزال غير مؤكد.","اختر خطوة صغيرة مفيدة الآن بدلا من البحث عن يقين كامل.","إذا كان القلق يحد من حياتك كثيرا، اطلب مشورة مختص."]},"darija":{"definition":"هاد الدراسة كتقدم GAD-7، استبيان معياري فيه سبعة أسئلة تدرس للتعرف على أعراض القلق العام وتتبعها.","use":"المرجع كيبين أهمية مناقشة القلق وتأثيرو مع مختص. التمرين ديالنا مستقل وما كيعوّض حتى سؤال من GAD-7.","limit":"هاد التمرين ماشي GAD-7 وماشي أداة معتمدة ولا تشخيص. غير وسيلة باش تفكر فمواقف الحياة اليومية.","duration":"الوقت: تقريبا جوج دقايق للأسئلة؛ جرب خطوات صغيرة فسيمانة إلا كانت مناسبة ليك.","plan":["ملي يبان القلق، كتب شنو عارف وشنو باقي ما واضحش.","اختار خطوة صغيرة نافعة دابا بلا ما تقلب على يقين كامل.","إلا كان القلق كيحد من حياتك بزاف، طلب النصيحة من مختص."]}},"questions":[{"id":"gad7-a","group":"uncertainty","fr":"Quand une situation est incertaine, j’ai du mal à laisser une question sans réponse immédiate.","en":"When a situation is uncertain, I struggle to leave a question unanswered for now.","ar":"عندما يكون الموقف غير واضح، يصعب علي ترك السؤال بلا إجابة فورية.","darija":"ملي كيكون الموقف ما واضحش، كيصعب عليا نخلي السؤال بلا جواب دغيا."},{"id":"gad7-b","group":"uncertainty","fr":"Je passe beaucoup de temps à imaginer plusieurs issues possibles.","en":"I spend a lot of time imagining different possible outcomes.","ar":"أقضي وقتا طويلا في تخيل نتائج محتملة مختلفة.","darija":"كنضيع وقت بزاف كنتخيل احتمالات مختلفة."},{"id":"gad7-c","group":"daily","fr":"Les inquiétudes interrompent souvent ce que j’essaie de faire.","en":"Worries often interrupt what I am trying to do.","ar":"غالبا ما تقاطع المخاوف ما أحاول القيام به.","darija":"القلق كيقاطع بزاف داكشي اللي كنحاول ندير."},{"id":"gad7-d","group":"daily","fr":"Après un moment tendu, j’ai du mal à revenir à mon activité.","en":"After a tense moment, I struggle to return to what I was doing.","ar":"بعد موقف متوتر، يصعب علي العودة إلى نشاطي.","darija":"من بعد موقف متوتر، كيصعب عليا نرجع للنشاط ديالي."},{"id":"gad7-e","group":"support","fr":"Je garde mes inquiétudes pour moi même quand elles deviennent pesantés.","en":"I keep worries to myself even when they become burdensome.","ar":"أحتفظ بمخاوفي لنفسي حتى عندما تصبح مرهقة.","darija":"كنخبي القلق ديالي حتى ملي كيولي تقيل."},{"id":"gad7-f","group":"support","fr":"Je repousse des activités importantes parce que je crains qu’elles se passent mal.","en":"I put off important activities because I fear they may go badly.","ar":"أؤجل أنشطة مهمة خوفا من ألا تسير جيدا.","darija":"كنأجل أنشطة مهمة حيث كنخاف ما يدوزوش مزيان."}]},{"id":"isi","citation":"Bastien CH, Vallières A, Morin CM. Insomnia Severity Index (2001).","url":"https://doi.org/10.1002/hup.1004","info":{"fr":{"definition":"Cette publication étudie l’Insomnia Severity Index (ISI), un questionnaire standardisé utilisé dans la recherche et le suivi de difficultés liées au sommeil.","use":"La référence rappelle que le sommeil peut être exploré de façon structurée et que son retentissement diurne compte. Les questions ci-dessous sont originales et ne sont pas celles de l’ISI.","limit":"Cette réflexion n’est pas l’ISI et ne mesure pas un trouble du sommeil. Des problèmes persistants ou gênants méritent une discussion avec un professionnel.","duration":"Temps : environ 2 minutes pour les questions, puis 1 à 2 minutes de notes par soir pendant une semaine si utile.","plan":["Pendant une semaine, note l’heure de lever et un facteur qui a facilité ou gêné le repos.","Garde une routine calme et réaliste avant le coucher, sans chercher à forcer le sommeil.","Demande conseil si la fatigue ou les nuits difficiles affectent régulièrement tes journées."]},"en":{"definition":"This paper studies the Insomnia Severity Index (ISI), a standardized questionnaire used in research and in monitoring sleep-related difficulties.","use":"The reference highlights structured reflection on sleep and its daytime impact. The questions below are original and are not ISI items.","limit":"This reflection is not the ISI and does not measure a sleep disorder. Persistent or disruptive problems are worth discussing with a professional.","duration":"Time: about 2 minutes for the questions, then 1–2 minutes of notes each evening for a week if useful.","plan":["For one week, note your wake-up time and one factor that helped or disrupted rest.","Keep a calm, realistic wind-down routine without trying to force sleep.","Seek advice if tiredness or difficult nights regularly affect your days."]},"ar":{"definition":"تتناول هذه الدراسة مؤشر شدة الأرق (ISI)، وهو استبيان معياري يستخدم في البحث ومتابعة صعوبات النوم.","use":"يشير المرجع إلى فائدة التأمل المنظم في النوم وتأثيره نهارا. الأسئلة أدناه أصلية وليست بنود ISI.","limit":"هذا التأمل ليس ISI ولا يقيس اضطرابا في النوم. تستحق المشكلات المستمرة أو المزعجة مناقشتها مع مختص.","duration":"الوقت: نحو دقيقتين للأسئلة، ثم دقيقة إلى دقيقتين من الملاحظات مساء لمدة أسبوع إذا كان ذلك مفيدا.","plan":["لمدة أسبوع، سجل وقت الاستيقاظ وعاملا ساعد على الراحة أو عرقلها.","حافظ على روتين هادئ وواقعي قبل النوم دون محاولة إجبار نفسك عليه.","اطلب المشورة إذا أثر التعب أو صعوبة النوم في نهارك باستمرار."]},"darija":{"definition":"هاد الدراسة كتدرس ISI، مؤشر معياري لصعوبات النعاس كيستعملوه فالبحث وتتبع مشاكل النوم.","use":"المرجع كيبين فائدة التفكير المنظم فالنعاس وتأثيرو فالنهار. الأسئلة اللي لتحت من صياغتنا وماشي أسئلة ISI.","limit":"هاد التأمل ماشي ISI وما كيقيسش اضطراب النوم. إلا بقات المشاكل ولا ولات كتأثر عليك، هضر مع مختص.","duration":"الوقت: تقريبا جوج دقايق للأسئلة، ومن بعد دقيقة ولا جوج ديال الملاحظات فالليل فسيمانة إلا نفعك.","plan":["لمدة سيمانة، كتب وقت الفياق وشي حاجة عاوناتك ولا عرقلات الراحة.","حافظ على روتين هادئ ومعقول قبل النعاس بلا ما تحاول تفرض النعاس على راسك.","طلب النصيحة إلا كان العياء ولا مشاكل الليل كيأثرو على النهار ديالك باستمرار."]}},"questions":[{"id":"isi-a","group":"routine","fr":"Mes horaires de repos changent beaucoup d’un jour à l’autre.","en":"My rest schedule changes a lot from one day to another.","ar":"تتغير مواعيد راحتي كثيرا من يوم لآخر.","darija":"مواقيت الراحة ديالي كتبدل بزاف من نهار لنهار."},{"id":"isi-b","group":"routine","fr":"Je n’ai pas encore trouvé de rituel calme qui me convienne le soir.","en":"I have not found a calm evening routine that works for me yet.","ar":"لم أجد بعد روتينا هادئا يناسبني في المساء.","darija":"ما لقيتش باقي روتين هادئ ديال الليل مناسب ليا."},{"id":"isi-c","group":"daytime","fr":"Après une nuit difficile, il m’est compliqué d’adapter mon rythme dans la journée.","en":"After a difficult night, I find it hard to adjust my pace during the day.","ar":"بعد ليلة صعبة، يصعب علي تعديل وتيرتي خلال النهار.","darija":"من بعد ليلة صعيبة، كيصعب عليا نبدل الوتيرة ديالي فالنهار."},{"id":"isi-d","group":"daytime","fr":"La fatigue rend certaines tâches ordinaires plus difficiles.","en":"Tiredness makes some ordinary tasks harder.","ar":"يجعلني التعب أجد بعض المهام اليومية أصعب.","darija":"العياء كيخلي شي مهام يومية تصعاب عليا."},{"id":"isi-e","group":"context","fr":"Je ne sais pas bien quels éléments de mon environnement influencent mon repos.","en":"I am not sure which parts of my environment affect my rest.","ar":"لست متأكدا مما في محيطي قد يؤثر في راحتي.","darija":"ما متأكدش شنو فالمحيط ديالي كيأثر على الراحة."},{"id":"isi-f","group":"context","fr":"Je ne demande pas conseil même si mes nuits difficiles se répètent.","en":"I do not seek advice even when difficult nights keep recurring.","ar":"لا أطلب المشورة حتى عندما تتكرر الليالي الصعبة.","darija":"ما كنطلبش النصيحة حتى ملي كتعاود الليالي الصعيبة."}]},{"id":"nice","citation":"NICE. Depression in adults: treatment and management (NG222, 2022; reviewed 2026).","url":"https://www.nice.org.uk/guidance/ng222","info":{"fr":{"definition":"NG222 est un guide de recommandations destiné aux professionnels sur l’évaluation, les soins et le suivi des adultes concernés par la dépression.","use":"Il sert ici à expliquer que les décisions de soins doivent tenir compte du vécu, des besoins et des préférences. Notre réflexion porte sur la préparation d’une conversation, pas sur les symptômes.","limit":"Une recommandation clinique n’est pas un questionnaire. Cet exercice ne reproduit pas le guide et ne choisit ni traitement ni diagnostic.","duration":"Temps : environ 5 minutes pour préparer quelques notes avant un échange, sans délai imposé pour obtenir des soins.","plan":["Note ce qui est le plus difficile dans ta vie quotidienne en ce moment.","Écris une question et une préférence que tu aimerais partager lors d’un rendez-vous.","Avec un professionnel, discute des options, bénéfices, limites et soutiens adaptés à ta situation."]},"en":{"definition":"NG222 is a professional guideline on assessment, care, and follow-up for adults affected by dépression.","use":"It is included to explain that care decisions should consider a person's experience, needs, and preferences. This reflection prepares for a conversation; it does not assess symptoms.","limit":"A clinical guideline is not a questionnaire. This exercise does not reproduce the guideline or select a treatment or diagnosis.","duration":"Time: about 5 minutes to prepare a few notes before a conversation; there is no set waiting period for care.","plan":["Note what is most difficult in daily life right now.","Write one question and one preference you might share at an appointment.","With a professional, discuss options, benefits, limits, and support that fit your situation."]},"ar":{"definition":"NG222 دليل مهني للتوصيات حول تقييم ورعاية ومتابعة البالغين المتأثرين بالاكتئاب.","use":"نذكره لتوضيح أهمية مراعاة تجربة الشخص واحتياجاته وتفضيلاته عند اتخاذ قرارات الرعاية. هذا التأمل للتحضير لمحادثة وليس لتقييم الأعراض.","limit":"الدليل السريري ليس استبيانا. هذا التمرين لا يعيد إنتاج الدليل ولا يختار علاجا أو تشخيصا.","duration":"الوقت: نحو خمس دقائق لتحضير بعض الملاحظات قبل الحديث؛ لا توجد مدة انتظار محددة للحصول على الرعاية.","plan":["اكتب ما هو الأصعب في حياتك اليومية حاليا.","اكتب سؤالا وتفضيلا ترغب في مشاركتهما في موعد صحي.","ناقش مع مختص الخيارات ومنافعها وحدودها والدعم المناسب لك."]},"darija":{"definition":"NG222 دليل مهني فيه توصيات على التقييم والرعاية والمتابعة ديال الكبار اللي كيتأثرو بالاكتئاب.","use":"ذكرناه باش نبينو أهمية تجربة الشخص واحتياجاتو واختياراتو فقرارات الرعاية. هاد التأمل كيوجدك للنقاش، ما كيقيمش الأعراض.","limit":"الدليل السريري ماشي استبيان. هاد التمرين ما كينسخش الدليل وما كيختارش علاج ولا تشخيص.","duration":"الوقت: تقريبا خمس دقايق باش توجد شي ملاحظات قبل النقاش؛ ما كايناش مدة انتظار مفروضة باش تطلب الرعاية.","plan":["كتب شنو هو أصعب حاجة فالحياة اليومية ديالك دابا.","وجد سؤال واختيار بغيتي تشاركهم فموعد مع مختص.","ناقش مع مختص الاختيارات والمنافع والحدود والدعم اللي مناسب ليك."]}},"questions":[{"id":"nice-a","group":"preparation","fr":"Je ne sais pas bien comment décrire à un professionnel l’effet de mon vécu sur ma journée.","en":"I am unsure how to explain to a professional how my experience affects my day.","ar":"لا أعرف كيف أشرح لمختص تأثير تجربتي في يومي.","darija":"ما عارفش كيفاش نشرح لمختص تأثير اللي كنعيش على نهاري."},{"id":"nice-b","group":"preparation","fr":"Je repousse la préparation de questions pour un rendez-vous de santé.","en":"I put off preparing questions for a health appointment.","ar":"أؤجل تحضير أسئلة لموعد صحي.","darija":"كنأجل نوجد أسئلة لموعد صحي."},{"id":"nice-c","group":"preferences","fr":"J’ai du mal à exprimer ce qui compte le plus pour moi dans un accompagnement.","en":"I find it hard to express what matters most to me in support or care.","ar":"يصعب علي التعبير عما يهمني أكثر في الدعم أو الرعاية.","darija":"كيصعب عليا نعبر على شنو مهم عندي فالدعم ولا الرعاية."},{"id":"nice-d","group":"preferences","fr":"Je ne me sens pas assez informé(e) pour poser des questions sur les options possibles.","en":"I do not feel informed enough to ask about possible options.","ar":"لا أشعر أن لدي معلومات كافية للسؤال عن الخيارات المتاحة.","darija":"ما كنحسش عندي معلومات كافية باش نسول على الاختيارات الممكنة."},{"id":"nice-e","group":"support","fr":"Je ne sais pas clairement qui pourrait m’accompagner ou me soutenir.","en":"I am not sure who could accompany or support me.","ar":"لست متأكدا ممن يمكنه مرافقتي أو دعمي.","darija":"ما واضحش ليا شكون يقدر يرافقني ولا يدعمني."},{"id":"nice-f","group":"support","fr":"Je trouve difficile de demander un suivi ou de reparler d’une option qui ne me convient pas.","en":"I find it difficult to ask for follow-up or revisit an option that does not suit me.","ar":"يصعب علي طلب المتابعة أو مناقشة خيار لا يناسبني مجددا.","darija":"كيصعب عليا نطلب المتابعة ولا نعاود نهضر على اختيار ما مناسبنيش."}]},{"id":"apa","citation":"American Psychiatric Association. Practice Guideline for the Treatment of Patients With Major Depressive Disorder (2010; 3rd ed.).","url":"https://www.psychiatry.org/psychiatrists/practice/clinical-practice-guidelines","info":{"fr":{"definition":"L’APA publie des recommandations professionnelles sur les soins liés à la dépression. Elles s’adressent aux cliniciens et ne constituent pas un questionnaire destiné au public.","use":"La référence rappelle qu’un accompagnement peut se discuter avec un professionnel. L’exercice ci-dessous aide à préparer ses questions et préférences; il ne reprend pas le texte du guide.","limit":"Il s’agit d’une réflexion maison, pas d’un test APA, d’un conseil médical ou d’une recommandation de traitement. Seul un professionnel peut discuter des soins adaptés.","duration":"Temps : 5 à 10 minutes pour noter tes questions et préférences avant un échange, sans attendre si tu as besoin d’aide.","plan":["Repère une difficulté concrète et un objectif qui aurait du sens pour toi.","Note ce que tu souhaites demander et les préoccupations à ne pas oublier.","Discute avec un professionnel des options adaptées, de leurs effets possibles et de tes préférences."]},"en":{"definition":"The APA publishes professional recommendations about dépression care. They are intended for clinicians, not a public questionnaire.","use":"The reference highlights that care can be discussed with a professional. This exercise helps prepare questions and preferences; it does not reproduce guideline text.","limit":"This is a custom reflection, not an APA test, medical advice, or treatment recommendation. A professional can discuss care suited to an individual.","duration":"Time: 5–10 minutes to note questions and preferences before a conversation; do not wait if you need help.","plan":["Identify one concrete difficulty and one goal that would matter to you.","Note what you would like to ask and any concerns you do not want to forget.","Discuss suitable options, possible effects, and your preferences with a professional."]},"ar":{"definition":"تنشر الجمعية الأمريكية للطب النفسي توصيات مهنية حول رعاية الاكتئاب. وهي موجهة للمختصين وليست استبيانا للجمهور.","use":"يشير المرجع إلى إمكانية مناقشة الرعاية مع مختص. يساعد هذا التمرين على تحضير الأسئلة والتفضيلات ولا يعيد إنتاج نص الدليل.","limit":"هذا تأمل مخصص وليس اختبارا للجمعية أو نصيحة طبية أو توصية بعلاج. يمكن لمختص مناقشة الرعاية المناسبة لكل شخص.","duration":"الوقت: من خمس إلى عشر دقائق لتدوين الأسئلة والتفضيلات قبل الحديث؛ لا تنتظر إذا كنت بحاجة إلى مساعدة.","plan":["حدد صعوبة ملموسة وهدفا مهما بالنسبة لك.","اكتب ما تريد السؤال عنه وأي مخاوف لا تريد نسيانها.","ناقش مع مختص الخيارات المناسبة وآثارها المحتملة وتفضيلاتك."]},"darija":{"definition":"الجمعية الأمريكية للطب النفسي كتنشر توصيات مهنية على رعاية الاكتئاب. هاد التوصيات للمختصين وماشي استبيان للناس.","use":"المرجع كيبين أن الرعاية ممكن تناقشها مع مختص. التمرين كيساعدك توجد الأسئلة والاختيارات ديالك وما كينسخش نص الدليل.","limit":"هاد التأمل من صياغتنا، ماشي اختبار ديال الجمعية ولا نصيحة طبية ولا توصية بعلاج. المختص يقدر يناقش معاك الرعاية المناسبة.","duration":"الوقت: من خمس حتى لعشر دقايق باش تكتب الأسئلة والاختيارات قبل النقاش؛ ما تسناش إلا كنت محتاج المساعدة.","plan":["حدد صعوبة واضحة وهدف مهم بالنسبة ليك.","كتب شنو بغيتي تسول وأي تخوف ما بغيتيش تنساه.","ناقش مع مختص الاختيارات المناسبة والآثار الممكنة والتفضيلات ديالك."]}},"questions":[{"id":"apa-a","group":"goals","fr":"J’ai du mal à formuler un objectif personnel pour un éventuel accompagnement.","en":"I find it hard to describe a personal goal for possible support.","ar":"يصعب علي صياغة هدف شخصي لأي دعم محتمل.","darija":"كيصعب عليا نحدد هدف شخصي لأي دعم ممكن."},{"id":"apa-b","group":"goals","fr":"Je ne sais pas encore quels changements dans ma vie quotidienne j’aimerais prioriser.","en":"I am not sure which changes in daily life I would like to prioritize.","ar":"لا أعرف بعد أي تغييرات في حياتي اليومية أود إعطاءها الأولوية.","darija":"ما عارفش باقي شنو التغييرات فالحياة اليومية اللي بغيت نعطيها الأولوية."},{"id":"apa-c","group":"communication","fr":"Je n’ose pas toujours dire qu’une proposition ne correspond pas à mes besoins.","en":"I do not always feel able to say when a suggestion does not fit my needs.","ar":"لا أستطيع دائما القول إن اقتراحا لا يناسب احتياجاتي.","darija":"ما كنقدرش ديما نقول إلا كان اقتراح ما مناسبش احتياجاتي."},{"id":"apa-d","group":"communication","fr":"J’ai du mal à parler des préoccupations ou des effets que je voudrais surveiller.","en":"I find it hard to discuss concerns or effects I would want to monitor.","ar":"يصعب علي مناقشة مخاوفي أو الآثار التي أود متابعتها.","darija":"كيصعب عليا نهضر على التخوفات ولا الآثار اللي بغيت نتبع."},{"id":"apa-e","group":"access","fr":"Je ne sais pas quelles questions poser pour comprendre les options de soutien.","en":"I do not know what questions to ask to understand support options.","ar":"لا أعرف ما الأسئلة التي أطرحها لفهم خيارات الدعم.","darija":"ما عارفش شنو الأسئلة اللي نسول باش نفهم اختيارات الدعم."},{"id":"apa-f","group":"access","fr":"Des obstacles pratiques me compliquent l’accès à un soutien adapté.","en":"Practical barriers make it harder for me to access suitable support.","ar":"تجعلني العوائق العملية أجد صعوبة في الوصول إلى دعم مناسب.","darija":"العراقيل العملية كتصعب عليا نوصل لدعم مناسب."}]}];

    const $ = (s) => document.querySelector(s);
    const $$ = (s) => [...document.querySelectorAll(s)];
    function getGuestAssessments() {
      return JSON.parse(localStorage.getItem("mc-assessments") || "[]");
    }

    function setGuestAssessments(list) {
      localStorage.setItem("mc-assessments", JSON.stringify(list));
    }

    async function accountRequest(path, options = {}) {
      const headers = new Headers(options.headers || {});
      const method = (options.method || "GET").toUpperCase();
      if (options.body || !["GET", "HEAD", "OPTIONS"].includes(method)) headers.set("Content-Type", "application/json");
      const response = await fetch(path, { ...options, headers, credentials: "same-origin", cache: "no-store" });
      const payload = await response.json();
      if (!response.ok) {
        const error = new Error(payload.error || t("account.serverUnavailable"));
        error.status = response.status;
        throw error;
      }
      return payload;
    }

    function setAccountStatus(message, isError = false) {
      const status = $("#account-status");
      status.textContent = message;
      status.classList.remove("hidden", "text-rose-300", "text-emerald-300");
      status.classList.add(isError ? "text-rose-300" : "text-emerald-300");
    }

    window.schemaLabels = {
      fr: { abandon: "Peur d'abandon", rejection: "Schema de rejet", inferiority: "Schema d'inferiorite", perfectionism: "Perfectionnisme rigide", dependence: "Dependance decisionnelle", mistrust: "Mefiance relationnelle", peoplepleasing: "Sur-adaptation", emotionaldeprivation: "Privation emotionnelle" },
      en: { abandon: "Abandonment fear", rejection: "Rejection schema", inferiority: "Inferiority schema", perfectionism: "Rigid perfectionism", dependence: "Decision dependence", mistrust: "Relational mistrust", peoplepleasing: "People pleasing", emotionaldeprivation: "Emotional deprivation" },
      ar: { abandon: "خوف الهجر", rejection: "مخطط الرفض", inferiority: "مخطط الدونية", perfectionism: "الكمالية الصارمة", dependence: "اعتماد مفرط", mistrust: "عدم الثقة", peoplepleasing: "ارضاء الاخرين", emotionaldeprivation: "حرمان عاطفي" },
      darija: { abandon: "الخوف من الهجر", rejection: "مخطط الرفض", inferiority: "مخطط النقص", perfectionism: "الكمالية الصارمة", dependence: "اعتماد زايد", mistrust: "نقص الثقة", peoplepleasing: "ارضاء الناس", emotionaldeprivation: "حرمان عاطفي" }
    };

    function renderAccountResults(data) {
      const target = $("#account-saved-results");
      target.replaceChildren();
      const rows = [
        ...data.assessments.map((result) => ({ ...result, kind: "assessment" })),
        ...data.schemas.map((result) => ({ ...result, kind: "schema" })),
        ...(data.reflections || []).map((result) => ({ ...result, kind: "reflection" }))
      ].sort((a, b) => new Date(b.date) - new Date(a.date));
      if (!rows.length) {
        const empty = document.createElement("p");
        empty.className = "text-sm text-slate-400";
        empty.textContent = t("account.noSavedResults");
        target.appendChild(empty);
        return;
      }
      rows.slice(0, 20).forEach((result) => {
        const article = document.createElement("article");
        article.className = "rounded-md border border-white/10 bg-slate-900/45 p-3";
        const heading = document.createElement("h4");
        heading.className = "font-medium";
        heading.textContent = `${t(result.kind === "assessment" ? "nav.assessment" : "nav.schemas")} · ${formatResultDate(result.date)}`;
        const scores = document.createElement("p");
        scores.className = "mt-1 text-sm text-slate-300";
        const labels = result.kind === "assessment" ? null
          : result.kind === "schema" ? window.schemaLabels[state.lang] : reflectionLabels[state.lang];
        scores.textContent = Object.entries(result.scores)
          .map(([key, score]) => `${labels ? labels[key] : t(`common.${key}`)}: ${typeof score === "number" ? score : score.score}/9`)
          .join(" · ");
        article.append(heading, scores);
        target.appendChild(article);
      });
    }

    function renderWeeklyReports(reports) {
      const target = $("#weekly-report-list");
      target.replaceChildren();
      if (!reports.length) {
        const empty = document.createElement("p");
        empty.className = "text-sm text-slate-400";
        empty.textContent = t("account.noReports");
        target.appendChild(empty);
        return;
      }
      reports.forEach(({ weekStart, report }) => {
        const article = document.createElement("article");
        article.className = "rounded-md border border-white/10 bg-slate-900/45 p-4";
        const heading = document.createElement("h4");
        heading.className = "font-medium";
        heading.textContent = `${t("account.reportStart")} ${formatResultDate(weekStart)}`;
        const counts = document.createElement("p");
        counts.className = "mt-2 text-sm text-slate-300";
        counts.textContent = `${t("account.reportAssessmentCount")}: ${report.assessmentCount} · ${t("account.reportSchemaCount")}: ${report.schemaCount} · ${t("reflection.title")}: ${report.reflectionCount || 0}`;
        article.append(heading, counts);
        const sections = [
          ["assessmentChange", ["stress", "anxiety", "dépression", "sleep"], null],
          ["schemaChange", Object.keys(window.schemaLabels[state.lang]), window.schemaLabels[state.lang]],
          ["reflectionChange", reflectionDimensions, reflectionLabels[state.lang]]
        ];
        let hasChanges = false;
        sections.forEach(([property, dimensions, labels]) => {
          const changes = report[property];
          if (!changes) return;
          hasChanges = true;
          const paragraph = document.createElement("p");
          paragraph.className = "mt-2 text-sm text-slate-200";
          const changeLines = dimensions.filter((key) => changes[key]).map((key) => {
            const item = changes[key];
            const delta = item.change > 0 ? `+${item.change}` : String(item.change);
            return `${labels ? labels[key] : t(`common.${key}`)}: ${item.previousWeek} ? ${item.latest} (${delta})`;
          });
          paragraph.textContent = `${t("account.reportChange")}: ${changeLines.join(" · ")}`;
          article.appendChild(paragraph);
        });
        if (!hasChanges) {
          const noCompare = document.createElement("p");
          noCompare.className = "mt-2 text-sm text-slate-300";
          noCompare.textContent = t("account.latestOnly");
          article.appendChild(noCompare);
        }
        const note = document.createElement("p");
        note.className = "mt-3 border-t border-white/10 pt-3 text-xs text-slate-400";
        note.textContent = t("account.reportNote");
        article.appendChild(note);
        target.appendChild(article);
      });
    }

    async function loadAccountData() {
      const [results, weekly] = await Promise.all([
        accountRequest("/api/results"),
        accountRequest("/api/weekly-reports")
      ]);
      renderAccountResults(results);
      renderWeeklyReports(weekly.reports);
    }

    async function setAuthenticatedAccount(user, message) {
      state.accountUser = user;
      $("#account-guest").classList.add("hidden");
      $("#account-authenticated").classList.remove("hidden");
      $("#account-email").textContent = user.email;
      $("#account-weekly-toggle").checked = user.weeklyReports;
      setAccountStatus(message);
      await loadAccountData();
    }

    async function initializeAccount() {
      if (window.location.protocol === "file:") {
        setAccountStatus(t("account.serverUnavailable"), true);
        return;
      }
      try {
        const response = await fetch("/api/session", { credentials: "same-origin", cache: "no-store" });
        if (response.status === 401) return;
        if (!response.ok) throw new Error(t("account.serverUnavailable"));
        const { user } = await response.json();
        if (!user) return;
        await setAuthenticatedAccount(user, t("account.loginSuccess"));
      } catch (error) {
        setAccountStatus(error.message || t("account.serverUnavailable"), true);
      }
    }

    async function syncGuestResults() {
      const assessments = getGuestAssessments();
      for (const result of assessments) {
        await accountRequest("/api/assessment-results", {
          method: "POST",
          body: JSON.stringify({ scores: result.scores, mode: result.mode })
        });
      }
      const schemaRaw = JSON.parse(localStorage.getItem("mc-combined-schema") || "null");
      if (schemaRaw?.scores) {
        const analysis = schemaAnalysis(schemaRaw.scores);
        await accountRequest("/api/schema-results", {
          method: "POST",
          body: JSON.stringify({ scores: analysis.normalizedByDim })
        });
      }
      const reflectionRaw = JSON.parse(localStorage.getItem("mc-combined-reflection") || "null");
      if (reflectionRaw?.scores) {
        await accountRequest("/api/reflection-results", {
          method: "POST",
          body: JSON.stringify({ scores: reflectionRaw.scores })
        });
      }
    }

    function applyPageLayout() {
      const allowedPages = ["home", "assessment", "schemas", "reflection", "mental-health", "methods", "breathing", "sleep", "results", "references", "login"];
      if (!allowedPages.includes(state.page)) state.page = "home";
      document.body.dataset.page = state.page;
      const welcomeIntro = $("#welcome-intro");
      const showWelcomeIntro = state.page === "home" && !hasSeenWelcomeIntro();
      if (showWelcomeIntro) document.body.setAttribute("data-home-intro", "true");
      else document.body.removeAttribute("data-home-intro");
      welcomeIntro.hidden = !showWelcomeIntro;
      welcomeIntro.setAttribute("aria-hidden", String(!showWelcomeIntro));
      const pageSection = {
        assessment: "assessment",
        schemas: "schema-test",
        reflection: "reflection-test",
        "mental-health": "mental-health-checkin",
        methods: "methods",
        breathing: "breathing",
        sleep: "sleep",
        results: "combined-results",
        references: "references",
        login: "account-page"
      }[state.page];

      Array.from($("#top").children)
        .filter((el) => el.tagName === "SECTION")
        .forEach((section) => {
          const isHidden = section.id === "welcome-intro"
            ? !showWelcomeIntro
            : state.page === "home"
            ? ["combined-results", "account-page", "assessment", "schema-test", "reflection-test", "mental-health-checkin", "dashboard", "methods", "breathing", "sleep", "references"].includes(section.id)
            : section.id !== pageSection;
          section.hidden = isHidden;
          section.classList.toggle("hidden", isHidden);
        });
      $$("[data-nav-page]").forEach((link) => {
        const isCurrentPage = link.dataset.navPage === state.page;
        const isCurrentSection = state.page === "home" && link.dataset.navSection === window.location.hash.slice(1);
        if (isCurrentPage || isCurrentSection) {
          link.setAttribute("aria-current", isCurrentPage ? "page" : "location");
        } else {
          link.removeAttribute("aria-current");
        }
      });
      updateWorkspaceHeader();
      renderFullAssessmentProgress();
      updateResultsPageLayout();
    }

    function animateRouteContent() {
      if (window.matchMedia?.("(prefers-reduced-motion: reduce)").matches) return;
      const homeTargets = ["main-home", "daily-note", "home-dashboard", "home-tests"]

      state.page = params.get("page") || "home";

      state.schemaFocus = params.get("topic") || "";

      applyPageLayout();
      applyTranslations();
      restoreLatestAssessmentResult();
      renderHomeProgress();
      renderDaypartNote();
      replayVisibleReveals();
      if (animate) animateRouteContent();
      if (scrollToTop) {
        if (window.location.hash) {
          requestAnimationFrame(() => document.querySelector(window.location.hash)?.scrollIntoView({ block: "start" }));
        } else {
          window.scrollTo(0, 0);

        const activeSection = document.querySelector("#top > section:not([hidden])");

      updateScrollProgress();
    }

        darija: { title: "8 مواضيع ديال التأمل", description: "ختار شي جزء باش تشوف النتيجة والتحليل ديالو بالتفصيل.", max: "من 9" }
      };
      const copy = titles[state.lang] || titles.fr;
      document.getElementById("schema-radial-title").textContent = copy.title;
      document.getElementById("schema-radial-description").textContent = copy.description;
      document.getElementById("schema-radial-center-label").textContent = copy.max;
      panel.hidden = false;
      petals.replaceChildren();
      legend.replaceChildren();

      const palette = ["#718677", "#a18c75", "#7d929d", "#b19b80", "#87958b", "#a7867c", "#829494", "#b6a589"];
      const scoreSuffix = state.lang === "en" ? "out of 9" : state.lang === "ar" || state.lang === "darija" ? "من 9" : "sur 9";
      const selectHint = state.lang === "en" ? "Select to open this theme's report." : state.lang === "ar" ? "اختر لفتح تقرير هذا الموضوع." : state.lang === "darija" ? "ختار باش تحل تقرير هاد الموضوع." : "Sélectionner pour ouvrir le rapport de ce thème.";
      const selectedKey = ordered.some(([key]) => key === activeKey) ? activeKey : ordered[0]?.[0];
      const polar = (radius, angle) => {
        const radians = angle * Math.PI / 180;
        return [180 + Math.cos(radians) * radius, 180 + Math.sin(radians) * radius];
      };
      const sectorPath = (outerRadius, innerRadius, start, end) => {
        const [outerStartX, outerStartY] = polar(outerRadius, start);
        const [outerEndX, outerEndY] = polar(outerRadius, end);
        const [innerEndX, innerEndY] = polar(innerRadius, end);
        const [innerStartX, innerStartY] = polar(innerRadius, start);
        return `M ${outerStartX} ${outerStartY} A ${outerRadius} ${outerRadius} 0 0 1 ${outerEndX} ${outerEndY} L ${innerEndX} ${innerEndY} A ${innerRadius} ${innerRadius} 0 0 0 ${innerStartX} ${innerStartY} Z`;
      };

      ordered.forEach(([key, rawScore], index) => {
        const label = window.schemaLabels?.[state.lang]?.[key] || key;
        const score = Math.max(0, Math.min(9, Number(rawScore) || 0));
        const start = -90 + index * 45 - 20.5;
        const end = start + 41;
        const sector = document.createElementNS("http://www.w3.org/2000/svg", "g");
        sector.setAttribute("class", `schema-radial-sector${key === selectedKey ? " is-selected" : " is-dimmed"}`);
        sector.setAttribute("role", "button");
        sector.setAttribute("tabindex", "0");
        sector.setAttribute("aria-pressed", String(key === selectedKey));
        sector.setAttribute("aria-label", `${label}: ${score.toFixed(1)} ${scoreSuffix}. ${selectHint}`);
        sector.dataset.schemaKey = key;
        sector.addEventListener("click", () => openSchemaTopic(key));
        sector.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openSchemaTopic(key); }
        });
        const base = document.createElementNS("http://www.w3.org/2000/svg", "path");
        base.setAttribute("d", sectorPath(148, 83, start, end));
        base.setAttribute("class", "schema-radial-base");
        sector.appendChild(base);
        const value = document.createElementNS("http://www.w3.org/2000/svg", "path");
        value.setAttribute("d", sectorPath(83 + (65 * score / 9), 83, start, end));
        value.setAttribute("class", "schema-radial-value");
        value.style.fill = palette[index % palette.length];
        value.style.pointerEvents = "none";
        const pathTitle = document.createElementNS("http://www.w3.org/2000/svg", "title");
        pathTitle.textContent = `${label}: ${score.toFixed(1)} ${scoreSuffix}`;
        value.appendChild(pathTitle);
        sector.appendChild(value);
        petals.appendChild(sector);

        const item = document.createElement("li");
        item.style.setProperty("--schema-color", palette[index % palette.length]);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "schema-radial-legend-button";
        button.dataset.schemaKey = key;
        button.setAttribute("aria-pressed", String(key === selectedKey));
        button.addEventListener("click", () => openSchemaTopic(key));
        const swatch = document.createElement("span");
        swatch.className = "schema-radial-swatch";
        swatch.setAttribute("aria-hidden", "true");
        const name = document.createElement("span");
        name.className = "schema-radial-name";
        name.textContent = label;
        const amount = document.createElement("strong");
        amount.textContent = `${score.toFixed(1)}/9`;
        button.append(swatch, name, amount);
        item.appendChild(button);
        legend.appendChild(item);
      });
      const active = ordered.find(([key]) => key === selectedKey);
      if (active) document.getElementById("schema-radial-center-value").textContent = Number(active[1]).toFixed(1);
    }

    function openSchemaTopic(key) {

        && ["stress", "anxiety", "dépression", "sleep"].every((key) => assessment.scores[key]?.max === 9));

        const focus = Object.hasOwn(schemaRaw.scores, state.schemaFocus) ? state.schemaFocus : "";

    function pickRandom(list, count) {
      const copy = [...list];
      const out = [];
      while (copy.length && out.length < count) {
        const idx = Math.floor(Math.random() * copy.length);
        out.push(copy.splice(idx, 1)[0]);
      }
      return out;
    }

    const assessmentDimensions = ["stress", "anxiety", "dépression", "sleep"];
    const assessmentQuestionHistoryKey = "mc-assessment-question-history";
    const activeAssessmentDraftKey = "mc-active-question-set";

    function isValidQuestionSet(ids, mode) {
      const expectedCount = mode === "detailed" ? 24 : 12;
      if (!Array.isArray(ids) || ids.length !== expectedCount || new Set(ids).size !== expectedCount) return false;
      const questions = ids.map((id) => questionBank.find((question) => question.id === id));
      if (questions.some((question) => !question)) return false;
      const expectedPerDimension = mode === "detailed" ? 6 : 3;
      return assessmentDimensions.every((dimension) => questions.filter((question) => question.dim === dimension).length === expectedPerDimension);
    }

    function readAssessmentDraft() {
      try {
        const draft = JSON.parse(localStorage.getItem(activeAssessmentDraftKey) || "null");
        if (!draft || !["quick", "detailed", "comparative"].includes(draft.mode) || !isValidQuestionSet(draft.ids, draft.mode)) return null;
        if (draft.answers !== undefined && (!draft.answers || typeof draft.answers !== "object" || Array.isArray(draft.answers)
          || Object.entries(draft.answers).some(([id, answer]) => !questionBank.some((question) => question.id === id) || !["0", "1", "2", "3"].includes(String(answer))))) return null;
        return { ...draft, answers: draft.answers || {} };
      } catch {
        return null;
      }
    }

    function captureAssessmentAnswers() {
      const form = $("#assessment-form");
      const current = form ? Object.fromEntries(new FormData(form).entries()) : {};
      state.assessmentAnswers = { ...state.assessmentAnswers, ...current };
      return { ...state.assessmentAnswers };
    }

    function storeAssessmentDraft() {
      if (!state.activeQuestions.length) return;
      const mode = $("#analysis-mode")?.value || "quick";
      const answers = captureAssessmentAnswers();
      localStorage.setItem(activeAssessmentDraftKey, JSON.stringify({
        mode,
        ids: state.activeQuestions.map((question) => question.id),
        answers
      }));
    }

    function readAssessmentQuestionHistory() {
      const empty = Object.fromEntries(assessmentDimensions.map((dimension) => [dimension, { used: [], last: [] }]));
      try {
        const saved = JSON.parse(localStorage.getItem(assessmentQuestionHistoryKey) || "null");
        if (!saved || typeof saved !== "object" || Array.isArray(saved)) return empty;
        assessmentDimensions.forEach((dimension) => {
          const group = saved[dimension];
          const allowedIds = new Set(questionBank.filter((question) => question.dim === dimension).map((question) => question.id));
          if (!group || !Array.isArray(group.used) || !Array.isArray(group.last)
            || [...group.used, ...group.last].some((id) => !allowedIds.has(id))) return;
          empty[dimension] = { used: [...new Set(group.used)], last: [...new Set(group.last)] };
        });
        return empty;
      } catch {
        return empty;
      }
    }

    function latestComparativeAssessment() {
      return getGuestAssessments().slice().reverse().find((entry) => entry?.mode === "comparative" && isValidQuestionSet(entry.questionIds, "comparative")) || null;
    }

    function chooseQuestionSet(mode, avoidIds = []) {
      if (mode === "comparative") {
        const baseline = latestComparativeAssessment();
        if (baseline) return pickRandom(baseline.questionIds.map((id) => questionBank.find((question) => question.id === id)), baseline.questionIds.length);
      }

      const history = readAssessmentQuestionHistory();
      const perDimension = mode === "detailed" ? 6 : 3;
      const selected = [];
      assessmentDimensions.forEach((dimension) => {
        const pool = questionBank.filter((question) => question.dim === dimension);
        if (mode === "detailed") {
          selected.push(...pickRandom(pool, perDimension));
          return;
        }
        let available = pool.filter((question) => !history[dimension].used.includes(question.id));
        if (available.length < perDimension) available = pool.filter((question) => !history[dimension].last.includes(question.id));
        const fresh = available.filter((question) => !avoidIds.includes(question.id));
        if (fresh.length >= perDimension) available = fresh;
        selected.push(...pickRandom(available, perDimension));
      });
      return pickRandom(selected, selected.length);
    }

    function recordAssessmentQuestionUsage(mode, questions) {
      const history = readAssessmentQuestionHistory();
      const perDimension = mode === "detailed" ? 6 : 3;
      assessmentDimensions.forEach((dimension) => {
        const pool = questionBank.filter((question) => question.dim === dimension);
        const selectedIds = questions.filter((question) => question.dim === dimension).map((question) => question.id);
        const remainingBeforeThisSet = pool.filter((question) => !history[dimension].used.includes(question.id)).length;
        const usedAtStart = remainingBeforeThisSet < perDimension ? history[dimension].last : history[dimension].used;
        history[dimension] = {
          used: [...new Set([...usedAtStart, ...selectedIds])],
          last: (mode === "detailed" ? pickRandom(questions.filter((question) => question.dim === dimension), 3) : questions.filter((question) => question.dim === dimension)).map((question) => question.id)
        };
      });
      localStorage.setItem(assessmentQuestionHistoryKey, JSON.stringify(history));
    }

    function sameQuestionSet(first, second) {
      if (!Array.isArray(first) || !Array.isArray(second) || first.length !== second.length) return false;
      const secondIds = new Set(second);
      return secondIds.size === second.length && first.every((id) => secondIds.has(id));
    }

    function buildQuestionSet(options = {}) {
      const selector = $("#analysis-mode");
      const draft = readAssessmentDraft();
      if (!options.forceNew && !state.activeQuestions.length && draft) {
        selector.value = draft.mode;
        state.activeQuestions = draft.ids.map((id) => questionBank.find((question) => question.id === id));
        state.assessmentAnswers = { ...draft.answers };
      } else {
        const mode = options.mode || selector.value || "quick";
        if (options.resetAnswers) state.assessmentAnswers = {};
        else captureAssessmentAnswers();
        selector.value = mode;
        state.activeQuestions = chooseQuestionSet(mode, options.avoidIds || []);
      }
      storeAssessmentDraft();
      renderAssessmentModeCopy();
    }

    function bindAnswerOptions(row) {

        if (!(input instanceof HTMLInputElement)) return;

          option.classList.toggle("answer-option-selected", option.contains(input));
        });
        if (row.closest("#questions")) {
          storeAssessmentDraft();
          updateAssessmentProgress();
        }
        const fullFlowForm = row.closest("#schema-form, #reflection-form");
        if (fullFlowForm) storeFullAssessmentDraft(fullFlowForm.id);
      });
    }

    function renderAssessmentModeCopy() {
      const copy = assessmentModeCopy[state.lang] || assessmentModeCopy.en;
      const mode = $("#analysis-mode")?.value || "quick";
      const subtitle = $("#assessment-subtitle");

    function updateAssessmentProgress() {
      const counter = $("#assessment-progress-count");

      const mode = $("#analysis-mode")?.value || "quick";
      const total = state.activeQuestions.length || (mode === "detailed" ? 24 : 12);
      const answers = Object.fromEntries(new FormData($("#assessment-form")).entries());
      const answered = state.activeQuestions.filter((question) => ["0", "1", "2", "3"].includes(answers[question.id])).length;

      counter.textContent = `${answered} / ${total}`;

      responses.forEach(({ dimension, score }) => { totals[dimension] += score; });
      return Object.fromEntries(reflectionDimensions.map((dimension) => [

        Math.round((totals[dimension] / 4) * 30) / 10

    function renderReflectionResults(scores) {
      const ordered = reflectionDimensions.map((key) => [key, scores[key]]).sort((a, b) => b[1] - a[1]);
      const highest = ordered[0][1];
      const lowest = ordered[ordered.length - 1][1];
      const mostReported = ordered.filter(([, score]) => score === highest);
      const lessReported = ordered.filter(([, score]) => score === lowest);
      $("#reflection-result-summary").textContent = `${t("reflection.summary")} ${mostReported.map(([key]) => reflectionLabels[state.lang][key]).join(", ")}.`;
      $("#reflection-result-profile").textContent = `${t("reflection.profile")} ${lessReported.map(([key]) => reflectionLabels[state.lang][key]).join(", ")}. ${t("reflection.scoreMethod")}.`;

        fill.className = "h-full rounded-full bg-cyan-400";

        row.append(header, track);
        rows.appendChild(row);
      });
      const prompts = $("#reflection-result-prompts");
      prompts.replaceChildren();

    function severity(score) {
      if (score <= 2) return "low";
      if (score <= 4) return "moderate";
      if (score <= 6) return "high";
      return "severe";
    }

    function buildResultInterpretation(scores, mode) {
      const dimOrder = ["stress", "anxiety", "dépression", "sleep"];
      const ranked = dimOrder.map((d) => ({ d, v: scores[d].score })).sort((a, b) => b.v - a.v);
      const top = ranked[0].d;
      const lv = severity(scores[top].score);
      const base = {
        fr: `Indicateur auto-rapporte le plus eleve: ${t(`common.${top}`)} (${t(`assessment.result${lv.charAt(0).toUpperCase()}${lv.slice(1)}`)}). Ce score invite a la réflexion et ne permet pas de tirer une conclusion clinique.`,
        en: `Highest self-reported indicator: ${t(`common.${top}`)} (${t(`assessment.result${lv.charAt(0).toUpperCase()}${lv.slice(1)}`)}). This score can support reflection; it cannot establish a clinical conclusion.`,

      const plan = (methodsByLang[state.lang]?.[top] || methodsByLang.en[top]).steps;
      return { summary: base[state.lang], plan, top, level: lv, ranked };

    function clearPrivateData() {
      if (!window.confirm(t("dashboard.confirmClear"))) return;

      Array.from({ length: localStorage.length }, (_, index) => localStorage.key(index))
        .filter((key) => key && key.startsWith("mc-"))
        .forEach((key) => localStorage.removeItem(key));

      Object.keys(state.resultTimers).forEach((type) => cancelResultReveal(type));
      state.lastResult = null;
      state.lastSchemaAnalysis = null;
      state.lastSchemaRaw = null;
      state.lastReflectionScores = null;
      state.referenceSessions = {};
      state.breathCycles = 0;
      $("#assessment-result").classList.add("hidden");
      const previousQuestionIds = state.activeQuestions.map((question) => question.id);
      $("#assessment-form").reset();
      $("#schema-form").reset();
      $("#reflection-form").reset();
      buildQuestionSet({ mode: $("#analysis-mode").value, forceNew: true, resetAnswers: true, avoidIds: previousQuestionIds });

      renderQuestions();

      buildReflectionQuestionSet();
      renderReflectionQuestions();

      $("#result-summary").textContent = "";

      $("#report-impression").textContent = "";

      $("#privacy-clear-status").textContent = t("dashboard.dataCleared");
    }

    function renderHistory() {
      const box = $("#history-chart");
      box.innerHTML = "";
      const list = getGuestAssessments();
      if (!list.length) {
        box.innerHTML = `<p class="text-sm text-slate-400">${state.lang === "en" ? "No saved history yet." : state.lang === "ar" ? "\u0644\u0627 \u062a\u0648\u062c\u062f \u0646\u062a\u0627\u0626\u062c \u0645\u062d\u0641\u0648\u0638\u0629 \u0628\u0639\u062f." : state.lang === "darija" ? "\u0645\u0627 \u0643\u0627\u064a\u0646\u0627\u0634 \u0646\u062a\u0627\u0626\u062c \u0645\u062d\u0641\u0648\u0638\u0629 \u062f\u0627\u0628\u0627." : "Aucun historique enregistre pour le moment."}</p>`;
        return;
      }
      const recent = list.slice(-6);
      recent.forEach((item, i) => {
        const value = item.scores
          ? Math.round(Object.values(item.scores).reduce((total, score) => total + (score.score / score.max) * 100, 0) / 4)
          : Math.min(100, Math.round((item.global / 25) * 100));
        box.innerHTML += `<div><div class="mb-1 flex justify-between text-xs text-slate-300"><span>#${i + 1}</span><span>${value}%</span></div><div class="h-2 rounded-full bg-white/10"><div class="h-2 rounded-full bg-cyan-400" style="width:${value}%"></div></div></div>`;
      });
    }

      $("#result-summary").textContent = interpretation.summary;

      const saved = getGuestAssessments();
      const previous = previousSnapshot === undefined
        ? saved.slice().reverse().find((item) => item.date !== date && item.mode === "comparative" && sameQuestionSet(item.questionIds, questionIds))
        : previousSnapshot;
      const hasComparablePrevious = mode === "comparative" && previous?.mode === "comparative"
        && sameQuestionSet(previous.questionIds, questionIds) && previous.scores
        && assessmentDimensions.every((key) => previous.scores[key]?.max === 9);

          ? `${copy.comparePrevious}: ${assessmentDimensions.map((key) => {

            const formatted = new Intl.NumberFormat(locale, { maximumFractionDigits: 1 }).format(Math.abs(difference));

    function scheduleResultReveal(type) {
      const targets = {
        assessment: ["#assessment-form", "#assessment-result-status", "#assessment-result", "#assessment-result-title"],
        schema: ["#schema-form", "#schema-result-status", "#schema-results", "#schema-result-heading"],
        reflection: ["#reflection-form", "#reflection-result-status", "#reflection-results", "#reflection-result-heading"]
      };
      const [formSelector, statusSelector, resultSelector, headingSelector] = targets[type];
      const form = $(formSelector);
      const status = $(statusSelector);
      const result = $(resultSelector);
      const heading = $(headingSelector);
      const submit = form.querySelector('button[type="submit"]');

      clearTimeout(state.resultTimers[type]);
      result.classList.add("hidden");
      status.classList.remove("hidden");
      submit.disabled = true;
      submit.classList.add("cursor-wait", "opacity-60");
      if (isFullAssessmentFlow()) {
        status.textContent = type === "reflection" ? fullAssessmentText().finish : fullAssessmentText().advance;
        state.resultTimers[type] = setTimeout(() => {
          state.resultTimers[type] = null;
          finishFullAssessmentStep(type);
        }, 1200);
        return;
      }
      state.resultTimers[type] = setTimeout(() => {
        state.resultTimers[type] = null;
        submit.disabled = false;
        submit.classList.remove("cursor-wait", "opacity-60");
        status.classList.add("hidden");
        const detail = { assessment: "assessment", schema: "schemas", reflection: "reflection" }[type];
        if (detail) {
          window.history.pushState({ page: "results", detail }, "", `?page=results&detail=${detail}`);
          state.page = "results";
          state.resultsDetail = detail;
          applyPageLayout();
          window.scrollTo(0, 0);
          document.getElementById("results-detail-title")?.focus({ preventScroll: true });
        }
        result.classList.remove("hidden");
        if (!detail) heading.focus({ preventScroll: true });
      }, 4500);
    }

      const raw = { stress: 0, anxiety: 0, dépression: 0, sleep: 0 };

      const scores = Object.fromEntries(Object.entries(raw).map(([dimension, total]) => [

        { score: Math.round((total / counts[dimension]) * 30) / 10, max: 9, level: severity(Math.round((total / counts[dimension]) * 30) / 10) }

      const global = Math.round(Object.values(scores).reduce((total, item) => total + (item.score / item.max) * 100, 0) / 4);

    function chooseReferenceQuestions(source) {
      const storageKey = `mc-reference-history-${source.id}`;
      const saved = localStorage.getItem(storageKey);
      let history = { used: [], last: [] };
      if (saved) {
        try {
          history = JSON.parse(saved);
        } catch (error) {
          if (!(error instanceof SyntaxError)) throw error;
          throw new Error("Question rotation history is damaged. Use the reset control on this exercise before continuing.");
        }
      }
      const validIds = new Set(source.questions.map((question) => question.id));
      if (!history || typeof history !== "object" || Array.isArray(history)
        || !Array.isArray(history.used) || !Array.isArray(history.last)
        || [...history.used, ...history.last].some((id) => !validIds.has(id))) {
        throw new Error("Question rotation history is invalid. Clear this browser's Mind Coach data and try again.");
      }

      const groups = [...new Set(source.questions.map((question) => question.group))];
      const chooseByGroup = (excluded) => {
        const selection = [];
        for (const group of groups) {
          const candidates = source.questions.filter((question) => question.group === group && !excluded.has(question.id));
          if (!candidates.length) return null;
          selection.push(pickRandom(candidates, 1)[0]);
        }
        return selection;
      };

      let selected = chooseByGroup(new Set(history.used));
      if (!selected) {
        selected = chooseByGroup(new Set(history.last));
        history.used = [...history.last];
      }
      if (!selected) throw new Error("This exercise needs at least one question in every reflection area.");

      history.used = [...new Set([...history.used, ...selected.map((question) => question.id)])];
      history.last = selected.map((question) => question.id);
      localStorage.setItem(storageKey, JSON.stringify(history));
      return pickRandom(selected, selected.length);
    }

      }
      if (!session || typeof session !== "object" || Array.isArray(session)) {
        setReferenceLibraryStatus("A saved reflection is invalid. Start a new exercise to replace it.");

      }
      const validIds = new Set(source.questions.map((question) => question.id));
      const answersValid = session.answers === null || (session.answers && typeof session.answers === "object" && !Array.isArray(session.answers)
        && Object.entries(session.answers).every(([id, score]) => session.questionIds?.includes(id) && validIds.has(id) && ["0", "1", "2", "3"].includes(String(score))));
      if (!Array.isArray(session.questionIds) || session.questionIds.length !== 3
        || new Set(session.questionIds).size !== 3
        || session.questionIds.some((id) => !validIds.has(id))
        || !answersValid
        || (session.result && (!session.answers || session.questionIds.some((id) => !Object.hasOwn(session.answers, id))))
        || typeof session.result !== "boolean"
        || typeof session.open !== "boolean") {
        setReferenceLibraryStatus("A saved reflection is invalid. Start a new exercise to replace it.");
        return null;
      }
      state.referenceSessions[source.id] = session;
      return session;

      const scores = questions.map((question) => Number(session.answers[question.id]));
      const average = scores.reduce((sum, score) => sum + score, 0) / scores.length;
      const frequentCount = scores.filter((score) => score >= 2).length;
      const highest = Math.max(...scores);
      const focusIndex = highest === 0 ? -1 : scores.findIndex((score) => score === highest);
      const result = document.createElement("section");

      result.appendChild(heading);

      const summary = document.createElement("p");
      summary.className = "mt-2 text-sm";
      summary.textContent = frequentCount === 0 ? copy.resultZero : frequentCount === scores.length ? copy.resultMany : copy.resultSome;
      result.appendChild(summary);

      const averageLine = document.createElement("p");
      averageLine.className = "mt-2 text-sm";
      const formattedAverage = new Intl.NumberFormat(document.documentElement.lang, { maximumFractionDigits: 1 }).format(average);
      averageLine.textContent = `${copy.score}: ${formattedAverage} / 3 · ${frequentCount} ${copy.frequent}`;
      result.appendChild(averageLine);
      const calculation = document.createElement("p");
      calculation.className = "mt-2 text-xs leading-relaxed text-slate-300";
      calculation.textContent = copy.calculation;
      result.appendChild(calculation);

      const focus = document.createElement("p");
      focus.className = "mt-3 rounded-md border border-white/10 p-3 text-sm";
      focus.textContent = focusIndex < 0
        ? `${copy.focus}: ${copy.focusNone}`

      const answersTitle = document.createElement("h5");
